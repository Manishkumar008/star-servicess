<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Star Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 min-h-screen flex items-center justify-center font-sans">

    <div class="max-w-lg w-full bg-white rounded-[2.5rem] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.1)] border border-slate-100">
        <div class="flex justify-between items-center mb-8">
            <button onclick="history.back()" class="text-slate-400 hover:text-indigo-600 transition">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-xs font-black uppercase tracking-[0.2em] text-slate-300 italic">Order Summary</h1>
        </div>

        <h2 class="text-3xl font-black text-slate-900 mb-2">Finalize Details</h2>
        <p class="text-slate-500 text-sm mb-8">Confirm your info & review selected items.</p>
        
        <div class="space-y-4">
            <input type="text" id="cust-name" placeholder="Full Name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500">
            <input type="tel" id="cust-phone" placeholder="WhatsApp Number" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500">
            <textarea id="cust-address" placeholder="Site Address for Measurement..." rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500"></textarea>

            <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-inner mt-6">
                <div id="bill-items-container" class="space-y-3 mb-4"></div>
                <div class="flex justify-between items-center border-t border-slate-700 pt-4 mt-2">
                    <span class="text-xs font-bold uppercase text-slate-400">Grand Total</span>
                    <span id="bill-total-display" class="text-2xl font-black text-amber-400">₹0</span>
                </div>
            </div>

            <button id="submit-decor-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black uppercase text-xs py-5 rounded-2xl shadow-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
                Confirm Order Now <i class="fa-solid fa-check-double"></i>
            </button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="text-green-500 text-6xl mb-4"><i class="fa-solid fa-circle-check"></i></div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Order Success!</h2>
            <p class="text-slate-600 text-sm font-medium">Thank you! Our team will connect with you in just 30 minutes.</p>
            <button onclick="window.location.href='index.html'" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold uppercase text-xs">Back to Home</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9m2rYxcx4e3LhZM5WaAZLzGHVYsepgjA",
            authDomain: "starservicesadmin.firebaseapp.com",
            projectId: "starservicesadmin",
            storageBucket: "starservicesadmin.firebasestorage.app",
            messagingSenderId: "429377488878",
            appId: "1:429377488878:web:1dfa774544de27d271f0ff"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const cartData = JSON.parse(localStorage.getItem('hkCart')) || [];
        const container = document.getElementById('bill-items-container');
        const totalDisplay = document.getElementById('bill-total-display');
        let netTotal = 0; 
        let summaryList = [];

        cartData.forEach(item => {
            netTotal += parseFloat(item.price);
            summaryList.push({ name: item.name, price: item.price });
            container.innerHTML += `
                <div class="flex justify-between text-sm">
                    <span class="text-slate-300">${item.name}</span>
                    <span class="font-bold">₹${item.price}</span>
                </div>`;
        });
        totalDisplay.innerText = `₹${netTotal}`;

        document.getElementById('submit-decor-btn').addEventListener('click', async () => {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone || !address) { alert("Bhai, Name, Phone, aur Address bharna zaroori hai!"); return; }
            if(cartData.length === 0) { alert("Bag mein items nahi hain!"); return; }

            const payload = {
                name: name,
                phone: phone,
                address: address,
                items: summaryList,
                totalPrice: netTotal,
                type: "Decor",
                leadStatus: "New Enquiry",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("Queries").add(payload);
                localStorage.removeItem('hkCart');
                // Success Modal dikhao
                document.getElementById('success-modal').classList.remove('hidden');
            } catch(e) { alert("Database error!"); }
        });
    </script>
</body>
</html>
