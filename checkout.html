<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Star Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .checkout-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; }
        
        .input-field { 
            background: #f1f5f9; border: 2px solid transparent; border-radius: 1rem; 
            padding: 1rem 1.25rem; width: 100%; transition: 0.3s; font-size: 0.95rem;
        }
        .input-field:focus { border-color: #4f46e5; outline: none; background: white; }

        .payment-radio:checked + .payment-label { border-color: #4f46e5; background-color: #f5f3ff; }
        .payment-radio:checked + .payment-label .radio-inner { background-color: #4f46e5; transform: scale(1); }
        .radio-outer { width: 22px; height: 22px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .radio-inner { width: 10px; height: 10px; border-radius: 50%; transform: scale(0); transition: 0.3s; }

        .upi-radio:checked + .upi-label { border-color: #4f46e5; background: #fff; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.1); }
        .upi-label { 
            transition: 0.3s; border: 2px solid #f1f5f9; cursor: pointer; 
            border-radius: 1.25rem; display: flex; flex-direction: column; 
            align-items: center; padding: 1.5rem; gap: 10px; min-height: 125px; justify-content: center;
        }
        .upi-label img { height: 35px; object-fit: contain; }

        .scanner-container {
            background: #0f172a; border-radius: 2.5rem; padding: 2.5rem 2rem;
            max-width: 350px; margin: 2rem auto; text-align: center; border: 1px solid #1e293b;
        }
        .qr-frame { background: white; padding: 1rem; border-radius: 1.5rem; display: inline-block; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }

        .qty-circle {
            width: 55px; height: 55px; background: white; border: 2px solid #eef2ff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #4f46e5; box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body class="pb-20">

    <nav class="w-full bg-white border-b py-5 px-10 mb-10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="heading-font text-2xl font-bold">Star <span class="text-indigo-600 italic">Services</span></a>
            <a href="ac-service.html" class="text-[10px] font-black uppercase tracking-widest text-gray-400">← Back</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10 items-start">
            
            <div class="lg:col-span-2 space-y-10">
                <div class="checkout-card p-10 border-t-8 border-t-indigo-50">
                    <h2 class="text-xl font-bold mb-10 flex items-center gap-3"><i class="fa-solid fa-receipt text-indigo-600"></i> Selected Services</h2>
                    <div id="checkout-list" class="space-y-6"></div>
                    <div class="mt-12 pt-10 border-t border-dashed border-slate-200">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-widest mb-1">Total Payable</p>
                                <p id="final-total-display" class="text-4xl font-black text-gray-900 italic tracking-tighter">₹0</p>
                            </div>
                            <div id="advance-alert-box" class="hidden text-right">
                                <p class="text-green-500 text-[10px] uppercase font-bold tracking-widest mb-1">Advance to Pay Now</p>
                                <p id="advance-amount-display" class="text-2xl font-black text-green-600 italic">₹400</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="checkout-card p-10">
                    <h2 class="text-xl font-bold mb-10 flex items-center gap-3"><i class="fa-solid fa-wallet text-indigo-600"></i> Payment Method</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <label class="cursor-pointer">
                            <input type="radio" name="payment" id="cos" value="COS" class="payment-radio hidden" checked onchange="toggleUPI()">
                            <div class="payment-label flex items-center justify-between p-8 border-2 border-slate-100 rounded-[2rem] transition-all">
                                <div class="flex items-center gap-5">
                                    <div class="radio-outer"><div class="radio-inner"></div></div>
                                    <div><p class="font-bold text-gray-900 text-lg">Pay After Service</p><p class="text-[9px] text-gray-400 font-bold uppercase">CASH (COS)</p></div>
                                </div>
                                <i class="fa-solid fa-hand-holding-dollar text-2xl opacity-20"></i>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="payment" id="advance" value="Advance" class="payment-radio hidden" onchange="toggleUPI()">
                            <div class="payment-label flex items-center justify-between p-8 border-2 border-slate-100 rounded-[2rem] transition-all">
                                <div class="flex items-center gap-5">
                                    <div class="radio-outer"><div class="radio-inner"></div></div>
                                    <div><p class="font-bold text-gray-900 text-lg">Pay in Advance</p><p class="text-[9px] text-gray-400 font-bold uppercase">ONLINE UPI (₹400 fixed)</p></div>
                                </div>
                                <i class="fa-solid fa-bolt text-2xl opacity-20"></i>
                            </div>
                        </label>
                    </div>

                    <div id="upi-box" class="hidden space-y-8 pt-10 border-t">
                        <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400">Select UPI App</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label><input type="radio" name="upi-app" value="GPay" class="upi-radio hidden" onchange="showQR('GPay')"><div class="upi-label"><img src="https://img.icons8.com/color/48/google-pay.png"><span class="text-[9px] font-bold uppercase">G-Pay</span></div></label>
                            <label><input type="radio" name="upi-app" value="PhonePe" class="upi-radio hidden" onchange="showQR('PhonePe')"><div class="upi-label"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo4x8kSTmPUq4PFzl4HNT0gObFuEhivHOFYg&s"><span class="text-[9px] font-bold uppercase">PhonePe</span></div></label>
                            <label><input type="radio" name="upi-app" value="Paytm" class="upi-radio hidden" onchange="showQR('Paytm')"><div class="upi-label"><img src="https://img.icons8.com/color/48/paytm.png"><span class="text-[9px] font-bold uppercase">Paytm</span></div></label>
                        </div>

                        <div id="qr-area" class="hidden scanner-container">
                            <p id="qr-label" class="text-indigo-400 font-bold text-[9px] tracking-widest mb-6 uppercase italic"></p>
                            <div class="qr-frame"><img id="qr-img" src="" class="w-56 h-56 object-contain" alt="QR"></div>
                            <p class="text-slate-500 text-[10px] mt-6 italic">Scan and pay now. Share screenshot after booking.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="checkout-card p-10 sticky top-28 border-t-8 border-t-indigo-600 shadow-xl">
                    <form id="booking-form" class="space-y-5">
                        <input type="text" id="cust-name" required class="input-field" placeholder="Full Name">
                        <input type="tel" id="cust-phone" required class="input-field" placeholder="WhatsApp Phone">
                        <textarea id="cust-address" required rows="3" class="input-field" placeholder="Full Address..."></textarea>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="service-date" required class="input-field">
                            <select id="service-slot" class="input-field"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
                        </div>
                        <button id="submit-btn" type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-6 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-xl mt-6 transition-all">Confirm Appointment</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <script>
    // 1. Firebase Core Configuration Setup
    const firebaseConfig = {
        apiKey: "AIzaSyC9m2rYxcx4e3LhZM5WaAZLzGHVYsepgjA",
        authDomain: "starservicesadmin.firebaseapp.com",
        projectId: "starservicesadmin",
        storageBucket: "starservicesadmin.firebasestorage.app",
        messagingSenderId: "429377488878",
        appId: "1:429377488878:web:1dfa774544de27d271f0ff"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let globalTotalCalculated = 0;
    let globalTotalQty = 0;
    
    // 2. Scanner Images Configuration Maps
    const qrConfig = {
        'GPay': 'images/googlepay.png.jpeg',
        'PhonePe': 'images/phonepay.png',
        'Paytm': 'images/paytm.png.jpeg'
    };

    // 3. Payment Method Screen UI Adjuster
    function toggleUPI() {
        const isAdv = document.getElementById('advance').checked;
        document.getElementById('upi-box').classList.toggle('hidden', !isAdv);
        document.getElementById('advance-alert-box').classList.toggle('hidden', !isAdv);
    }

    // 4. Load & Populate QR
    function showQR(app) {
        document.getElementById('qr-img').src = qrConfig[app];
        document.getElementById('qr-label').innerText = `Scan to Pay with ${app}`;
        document.getElementById('qr-area').classList.remove('hidden');
    }

    // 5. Build Cart View Metrics Stream dynamically
    function loadCheckout() {
        const cart = JSON.parse(localStorage.getItem('StarCart')) || [];
        const container = document.getElementById('checkout-list');
        let total = 0;
        let totalUnitsCount = 0;
        container.innerHTML = '';
        
        if(cart.length === 0) {
            container.innerHTML = '<p class="text-center text-gray-400 py-10 font-bold italic">Your cart is empty!</p>';
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').classList.add('opacity-50');
            return;
        }

        cart.forEach((item) => {
            total += item.total;
            totalUnitsCount += parseInt(item.qty || 1);
            container.innerHTML += `
                <div class="flex justify-between items-center bg-slate-50 p-4 md:p-6 rounded-[1.5rem] md:rounded-[2rem] border border-slate-100">
                    <div class="flex items-center gap-4 md:gap-6">
                        <div class="qty-circle scale-90 md:scale-100">${item.qty}</div>
                        <div>
                            <h3 class="font-bold text-[10px] md:text-xs text-gray-900 uppercase">${item.name}</h3>
                            <p class="text-[8px] md:text-[9px] text-gray-400 font-bold">₹${item.price} / unit</p>
                        </div>
                    </div>
                    <span class="text-lg md:text-xl font-black italic text-gray-900 whitespace-nowrap">₹${item.total}</span>
                </div>`;
        });
        
        globalTotalCalculated = total;
        globalTotalQty = totalUnitsCount;
        document.getElementById('final-total-display').innerText = '₹' + total;

        // Auto-fill parameters if logged in configuration cookie active
        const loggedInUser = JSON.parse(localStorage.getItem('LoggedInUser'));
        if (loggedInUser) {
            document.getElementById('cust-name').value = loggedInUser.name || '';
            document.getElementById('cust-phone').value = loggedInUser.phone || '';
            document.getElementById('cust-address').value = loggedInUser.address || '';
        }
    }

    // 6. Form Submission Transactional Interceptor Engine 
document.getElementById('booking-form').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.innerText = "Processing Cloud Pipeline..."; 
    btn.disabled = true;

    const cart = JSON.parse(localStorage.getItem('StarCart')) || [];
    const isAdv = document.getElementById('advance').checked;
    const upiSelected = isAdv ? document.querySelector('input[name="upi-app"]:checked')?.value || 'Online Advance' : 'COD';

    // Calculation mapping logic
    let advancePaidAmount = isAdv ? 400 : 0; 
    let remainingCodAmount = globalTotalCalculated - advancePaidAmount;

    // --- FIX: ITEMS ARRAY PAYLOAD ---
    const payload = {
        type: "AC",
        name: document.getElementById('cust-name').value.trim(),
        phone: document.getElementById('cust-phone').value.trim(),
        address: document.getElementById('cust-address').value.trim() + ` (Date: ${document.getElementById('service-date').value} | Slot: ${document.getElementById('service-slot').value})`,
        
        // YE LINE SABSE IMPORTANT HAI - AB ITEMS BHI FIREBASE MEIN JAYENGE
        items: cart, 
        
        quantity: globalTotalQty.toString(),
        paymentMethod: isAdv ? `Advance Paid via ${upiSelected}` : "Cash On Delivery (COD)",
        totalAmount: globalTotalCalculated.toString(),
        advance: advancePaidAmount.toString(),
        cod: remainingCodAmount.toString(),
        leadStatus: "Pending", // Admin dashboard ke liye default status
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
        await db.collection("Queries").add(payload);
        
        // --- ORDER SUCCESS PAGE KE LIYE DATA SAVE KARO ---
        localStorage.setItem('LastBooking', JSON.stringify(payload));
        
        localStorage.removeItem('StarCart'); 
        alert("Appointment Booked Successfully!");
        window.location.href = "order-success.html";
    } catch (error) {
        console.error("Critical Cloud error: ", error);
        alert("Database entry push failure. Try again.");
        btn.disabled = false; 
        btn.innerText = "Confirm Appointment";
    }
};
    

    window.onload = loadCheckout;
</script>

</body>
</html>
